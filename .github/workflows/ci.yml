name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q mkdsc tauri_backend.py
      - run: python -m pytest

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The committed bundle in static/ must match the sources, otherwise the
      # web panel served by `python web_panel.py` shows a stale UI.
      - name: Verify static/ is up to date
        run: |
          if [ -n "$(git status --porcelain static/)" ]; then
            echo "static/ is out of date -- run 'npm --prefix frontend run build' and commit the result"
            git status --porcelain static/
            exit 1
          fi
