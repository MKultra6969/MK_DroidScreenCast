name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  rust:
    name: Rust tests and lint
    # Same runner and toolchain as release.yml on purpose: this job exists to
    # fail here rather than halfway through a tagged release build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The crate links the real Tauri, so even `cargo test` needs WebKitGTK.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # tauri.conf.json points the build at the frontend bundle, and the build
      # script refuses to run while it is missing. It is a build output and
      # gitignored; an empty directory is enough for the tests.
      - name: Create the gitignored path the Tauri build script requires
        run: mkdir -p frontend/dist-tauri

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  alpine:
    name: Alpine (musl) build
    # Same recipe as the alpine job in release.yml, minus the upload. It lives
    # here so a break shows up on push instead of halfway through a release —
    # nothing else in CI compiles against musl or Alpine's WebKitGTK.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # `docker run`, not a `container:` job: GitHub injects a glibc-linked
      # Node into container jobs to run actions like actions/checkout, and it
      # cannot start on musl.
      - name: Build inside Alpine 3.23
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.23 sh -eu -c '
            apk add --no-cache \
              build-base pkgconf git \
              webkit2gtk-4.1-dev libayatana-appindicator-dev librsvg \
              openssl-dev curl wget file \
              nodejs npm rust cargo
            npm --prefix frontend ci
            npm --prefix frontend run build
            cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          '

      # Compiling is not the same as starting. This resolves the binary's
      # dynamic dependencies inside a clean Alpine that has only the runtime
      # packages — no -dev, no toolchain — so a library that exists solely on
      # the build side would show up here as a missing symbol.
      #
      # Running `ldd` on the host instead would be meaningless: it resolves a
      # musl binary against the runner's glibc libraries and reports half of
      # them as missing whether they are or not.
      - name: Check it resolves on a clean Alpine
        run: |
          sudo chmod a+rx src-tauri/target/release/mkdsc-tauri
          file src-tauri/target/release/mkdsc-tauri
          docker run --rm -v "$PWD:/work" -w /work alpine:3.23 sh -eu -c '
            apk add --no-cache musl-utils webkit2gtk-4.1 gtk+3.0               libayatana-appindicator librsvg font-dejavu               android-tools scrcpy
            ldd src-tauri/target/release/mkdsc-tauri
            adb --version | head -1
            scrcpy --version | head -1
          '

      - uses: actions/upload-artifact@v4
        with:
          name: mkdsc-linux-x86_64-musl
          path: src-tauri/target/release/mkdsc-tauri
          if-no-files-found: error
