name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q mkdsc tauri_backend.py
      - run: python -m pytest

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The committed bundle in static/ must match the sources, otherwise the
      # web panel served by `python web_panel.py` shows a stale UI.
      - name: Verify static/ is up to date
        run: |
          if [ -n "$(git status --porcelain static/)" ]; then
            echo "static/ is out of date -- run 'npm --prefix frontend run build' and commit the result"
            git status --porcelain static/
            exit 1
          fi

  rust:
    name: Rust tests and lint
    # Same runner and toolchain as release.yml on purpose: this job exists to
    # fail here rather than halfway through a tagged release build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The crate links the real Tauri, so even `cargo test` needs WebKitGTK.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # tauri.conf.json lists both as bundle resources, and the build script
      # refuses to run while they are missing. Everything else it lists is
      # committed; these two are build outputs and gitignored. Empty
      # directories are enough here — no step reads their contents.
      - name: Create the gitignored paths the Tauri build script requires
        run: mkdir -p bin frontend/dist-tauri

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
