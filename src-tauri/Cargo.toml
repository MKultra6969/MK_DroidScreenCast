[package]
name = "mkdsc-tauri"
version = "1.0.2"
description = "MK DroidScreenCast"
authors = ["MKultra69"]
edition = "2024"
# Edition 2024 требует Rust 1.85+; без этого cargo падает с невнятным
# сообщением про неизвестный edition.
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` обязателен: конфигом владеет Rust, а `config.json` правится
# руками и через редактор в UI. С дефолтным `BTreeMap` первая же запись
# отсортировала бы ключи по алфавиту и перетасовала весь файл.
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
uuid = { version = "1", features = ["v4"] }
# Внешние процессы (adb) запускаются из async-команд, поэтому нужен
# именно tokio::process: std::process заблокировал бы поток рантайма.
# Сам tokio уже приходит транзитивно с Tauri, лишнего веса тут нет.
# `sync` — замок фоновой задачи, раздающей список устройств: он держится
# через `await`, и `std::sync::Mutex` для этого не годится.
# `io-util` и `rt` — ради `adb pair`: код спаривания пишется в stdin, а вывод
# вычитывается отдельными задачами.
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "rt"] }
# Для timestamp в формате `datetime.now().isoformat()` — локальное время без
# таймзоны. Тоже уже есть в дереве зависимостей Tauri.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
